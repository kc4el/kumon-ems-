{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Staff Login &bull; Kumon EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+Pro:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=3.5" />
  <link rel="stylesheet" href="{% static 'css/kumon-loading.css' %}" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('kumon_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var initial = (saved === 'dark' || (!saved && prefersDark)) ? 'dark' : 'light';
        if (initial === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();

    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initTheme === 'function') {
        initTheme();
      } else {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (typeof updateThemeToggleUI === 'function') updateThemeToggleUI(isDark ? 'dark' : 'light');
      }
    });
  </script>
</head>

<body class="auth-page-body">
  <div class="auth-standalone-layout">
    <!-- Top Branding Navbar -->
    <header class="auth-top-navbar">
      <div class="brand-header" style="margin-bottom: 0;">
        <div class="brand-logo-box brand-kumon-box">
          <img src="{% static 'images/kumon-logo.png' %}" alt="Kumon Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='../../../static/images/kumon-logo.png';" />
        </div>
      </div>
      <div class="auth-top-actions">
        <button type="button" class="portal-theme-toggle" id="themeToggleBtn" title="Switch to dark mode" aria-label="Switch to dark mode" onclick="toggleTheme()">
          <span class="portal-theme-icon-box">
            <svg id="themeIconSun" class="theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" class="theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
          <span class="portal-theme-label" id="themeToggleLabel">Light mode</span>
        </button>
      </div>
    </header>

    <!-- Center Authentication Stage -->
    <main class="auth-center-stage">
      <div class="auth-card-container">

        <div class="penpot-auth-card" id="authScreenNewStaff">
          <div class="penpot-auth-badge badge-onboarding">NEW STAFF SIGN IN</div>
          <h1 class="penpot-auth-title">New staff sign in</h1>
          <p class="penpot-auth-sub">Use the Employee ID and temporary password provided by HR. You can link your Google/email account later in your profile settings.</p>

          <form id="onboardingLoginForm" class="penpot-auth-form" onsubmit="handleOnboardingLogin(event)">
            <div class="penpot-form-group">
              <label class="penpot-form-label" for="onboardingEmployeeId">Employee ID</label>
              <div class="penpot-input-wrap">
                <input type="text" id="onboardingEmployeeId" class="penpot-input" autocomplete="username" placeholder="EMP-2026-1234" required />
              </div>
            </div>

            <div class="penpot-form-group">
              <label class="penpot-form-label" for="onboardingTemporaryPassword">Temporary password from HR</label>
              <div class="penpot-input-wrap">
                <input type="password" id="onboardingTemporaryPassword" class="penpot-input has-action" autocomplete="current-password" placeholder="Enter your temporary password" required />
                <button type="button" class="penpot-input-action" onclick="togglePasswordVisibility('onboardingTemporaryPassword', this)">Show</button>
              </div>
            </div>

            <button type="submit" class="penpot-btn-primary-navy">Sign In to Portal</button>
          </form>
        </div>

      </div>
    </main>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toastContainer" class="toast-stack"></div>
  {% include "core/partials/kumon_loading_overlay.html" %}

  <script src="{% static 'js/kumon-loading.js' %}"></script>
  <script src="{% static 'js/dashboard.js' %}?v=6.2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('onboardingEmployeeId')?.focus();
    });
  </script>
</body>

</html>
