<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:#fff;color:#111;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h2{margin:0 0 2px;font-size:19px;color:#111}
  p.sub{margin:0 0 12px;color:#555;font-size:12px}
  svg{width:100%;height:auto;display:block;background:#fff}
  .life{stroke:#333;stroke-width:1.5}
  .dash{stroke-dasharray:6 4}
  .act{fill:#e8f0e8;stroke:#333;stroke-width:1.2}
  .alt{fill:none;stroke:#333;stroke-width:1.2}
  .t{fill:#111}
  .mut{fill:#555}
  .b{font-weight:700}
  .msg{stroke:#111;stroke-width:1.4;fill:none}
  .lbl{font-size:11.5px}
  .ret{stroke-dasharray:5 4}
</style></head><body>
<h2>Figure 4 — Sequence Diagram: Employee Onboarding</h2>
<p class="sub">UML sequence · POST /api/employees/ · Supabase-first create with compensating delete_user rollback on local failure</p>
<svg viewBox="0 0 1120 560" role="img" aria-label="Onboarding sequence diagram">
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:#111"/>
    </marker>
  </defs>

  <!-- Participants -->
  <text class="t b" x="90" y="30" font-size="14" text-anchor="middle">Browser</text>
  <text class="t b" x="410" y="30" font-size="14" text-anchor="middle">Django / DRF</text>
  <text class="t b" x="730" y="30" font-size="14" text-anchor="middle">Supabase Auth</text>
  <text class="t b" x="1020" y="30" font-size="14" text-anchor="middle">Database</text>
  <line class="life dash" x1="90" y1="42" x2="90" y2="530"/>
  <line class="life dash" x1="410" y1="42" x2="410" y2="530"/>
  <line class="life dash" x1="730" y1="42" x2="730" y2="530"/>
  <line class="life dash" x1="1020" y1="42" x2="1020" y2="530"/>

  <!-- 1. POST -->
  <line class="msg" x1="90" y1="80" x2="405" y2="80" marker-end="url(#ah4)"/>
  <text class="t lbl" x="247" y="72" text-anchor="middle">1: POST /api/employees/ {name, email, …}</text>
  <!-- 2. validate -->
  <rect class="act" x="395" y="100" width="180" height="34" rx="4"/>
  <text class="t lbl" x="485" y="122" text-anchor="middle">2: serializer validates input</text>
  <!-- 3. create_user -->
  <line class="msg" x1="575" y1="160" x2="725" y2="160" marker-end="url(#ah4)"/>
  <text class="t lbl" x="650" y="152" text-anchor="middle">3: create_user(email)</text>
  <line class="msg ret" x1="725" y1="190" x2="575" y2="190" marker-end="url(#ah4)"/>
  <text class="t lbl" x="650" y="182" text-anchor="middle">4: auth id</text>
  <!-- 5. save -->
  <line class="msg" x1="575" y1="230" x2="1015" y2="230" marker-end="url(#ah4)"/>
  <text class="t lbl" x="795" y="222" text-anchor="middle">5: save Employee row (id = auth id)</text>

  <!-- alt frame -->
  <rect class="alt" x="330" y="260" width="470" height="220" rx="6"/>
  <text class="t b lbl" x="342" y="282">alt — local save outcome</text>
  <line class="msg ret" x1="1015" y1="310" x2="575" y2="310" marker-end="url(#ah4)"/>
  <text class="t lbl" x="795" y="302" text-anchor="middle">[success] 6a: row saved → 201 Created</text>
  <line class="msg ret" x1="1015" y1="350" x2="575" y2="350" marker-end="url(#ah4)"/>
  <text class="t lbl" x="795" y="342" text-anchor="middle">[failure] 6b: IntegrityError / DB error</text>
  <line class="msg" x1="575" y1="395" x2="725" y2="395" marker-end="url(#ah4)"/>
  <text class="t lbl" x="650" y="387" text-anchor="middle">7: delete_user(auth id)</text>
  <text class="mut lbl" x="650" y="405" text-anchor="middle">rollback — no orphan account</text>
  <line class="msg ret" x1="405" y1="440" x2="95" y2="440" marker-end="url(#ah4)"/>
  <text class="t lbl" x="250" y="432" text-anchor="middle">8: 409 duplicate / 502 upstream</text>

  <text class="mut lbl" x="24" y="520">Symbols: UML sequence — vertical dashed line = lifeline · solid arrow = call · dashed arrow = return · box = alternative paths.</text>
</svg>
</body></html>
